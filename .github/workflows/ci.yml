name: CI

on:
  pull_request:
  push:
    branches: [main]

# The job only reads the code. Caching and the report upload use the Actions
# runtime token, not GITHUB_TOKEN, so they need no extra scope.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # ubuntu-latest already has the libraries Chromium needs, and apt
      # (install-deps) sometimes takes 9-12 minutes. Only fall back to it if
      # Chromium cannot start.
      - name: Install Playwright system dependencies if Chromium cannot start
        timeout-minutes: 12
        run: |
          if node -e "require('@playwright/test').chromium.launch().then((b) => b.close())"; then
            echo "Chromium starts with the runner's libraries; skipping install-deps."
          else
            npx playwright install-deps chromium
          fi
      # font-swap.spec.ts checks the page does not move when the web fonts
      # replace their fallbacks. Android phones fall back to Roboto, which the
      # runner lacks: install the file Google Fonts ships, pinned and checked.
      - name: Install Roboto for the font-swap e2e
        run: |
          mkdir -p ~/.local/share/fonts
          curl -sSfL -o ~/.local/share/fonts/Roboto.ttf "https://raw.githubusercontent.com/google/fonts/1c627bfa375fc51cf86fabeca4f6e08a95f0aa5c/ofl/roboto/Roboto%5Bwdth,wght%5D.ttf"
          echo "d7598e12c5dbef095ff8272cfc55da0250bd07fbdecbac8a530b9b277872a134  $HOME/.local/share/fonts/Roboto.ttf" | sha256sum -c -
          fc-cache -f ~/.local/share/fonts
          fc-list : family | grep -i -E "roboto|liberation|arimo|cousine" | sort -u || true
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
